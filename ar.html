<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>AR Kimia — Mobile</title>
<script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
<style>
*{box-sizing:border-box}
html,body{margin:0!important;padding:0!important;width:100%!important;height:100%!important;overflow:hidden!important;background:#000!important}
a-scene{position:fixed!important;left:0!important;top:0!important;width:100vw!important;height:100vh!important;height:100dvh!important;margin:0!important;padding:0!important;overflow:hidden!important}
.a-canvas{position:fixed!important;left:0!important;top:0!important;width:100vw!important;height:100vh!important;height:100dvh!important}
video{position:fixed!important;left:0!important;top:0!important;width:100vw!important;height:100vh!important;height:100dvh!important;object-fit:cover!important}
#info{position:fixed;z-index:10000;top:max(10px,env(safe-area-inset-top));left:10px;right:10px;padding:10px 12px;border-radius:12px;background:rgba(255,255,255,.90);color:#111;font:14px Arial,sans-serif}
#mol{font-weight:bold;margin-top:3px}
</style>
</head>
<body>
<div id="info"><strong>AR Kimia — Scan Once</strong><div id="status">Menyiapkan kamera...</div><div id="mol"></div></div>

<a-scene mindar-image="imageTargetSrc: ./targets.mind; maxTrack: 1;" color-space="sRGB" renderer="colorManagement: true" vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false">
<a-assets timeout="30000">
<a-asset-item id="h2o" src="./air-h2o.glb"></a-asset-item>
<a-asset-item id="nh3" src="./amonia-nh3.glb"></a-asset-item>
<a-asset-item id="co2" src="./co2.glb"></a-asset-item>
<a-asset-item id="ch4" src="./metana-ch4.glb"></a-asset-item>
<a-asset-item id="pcl5" src="./pcl5.glb"></a-asset-item>
<a-asset-item id="sf6" src="./sf6.glb"></a-asset-item>
</a-assets>
<a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

<a-entity mindar-image-target="targetIndex:0"><a-gltf-model src="#h2o" position="0 0 0.15" scale="0.35 0.35 0.35" animation="property:rotation;to:0 360 0;dur:8000;loop:true;easing:linear"></a-gltf-model></a-entity>
<a-entity mindar-image-target="targetIndex:1"><a-gltf-model src="#nh3" position="0 0 0.15" scale="0.35 0.35 0.35" animation="property:rotation;to:0 360 0;dur:8000;loop:true;easing:linear"></a-gltf-model></a-entity>
<a-entity mindar-image-target="targetIndex:2"><a-gltf-model src="#co2" position="0 0 0.15" scale="0.35 0.35 0.35" animation="property:rotation;to:0 360 0;dur:8000;loop:true;easing:linear"></a-gltf-model></a-entity>
<a-entity mindar-image-target="targetIndex:3"><a-gltf-model src="#ch4" position="0 0 0.15" scale="0.35 0.35 0.35" animation="property:rotation;to:0 360 0;dur:8000;loop:true;easing:linear"></a-gltf-model></a-entity>
<a-entity mindar-image-target="targetIndex:4"><a-gltf-model src="#pcl5" position="0 0 0.15" scale="0.35 0.35 0.35" animation="property:rotation;to:0 360 0;dur:8000;loop:true;easing:linear"></a-gltf-model></a-entity>
<a-entity mindar-image-target="targetIndex:5"><a-gltf-model src="#sf6" position="0 0 0.15" scale="0.35 0.35 0.35" animation="property:rotation;to:0 360 0;dur:8000;loop:true;easing:linear"></a-gltf-model></a-entity>
</a-scene>

<script>
const status=document.getElementById("status"), mol=document.getElementById("mol");
const names=["H₂O — Air","NH₃ — Amonia","CO₂ — Karbon dioksida","CH₄ — Metana","PCl₅ — Fosfor pentaklorida","SF₆ — Sulfur heksafluorida"];
function forceResize(){
 const w=window.innerWidth,h=window.innerHeight;
 const scene=document.querySelector("a-scene"), canvas=document.querySelector("canvas.a-canvas");
 if(scene){scene.style.width=w+"px";scene.style.height=h+"px";}
 if(canvas){canvas.style.width=w+"px";canvas.style.height=h+"px";}
}
window.addEventListener("resize",forceResize);
window.addEventListener("orientationchange",()=>setTimeout(forceResize,300));
document.querySelector("a-scene").addEventListener("loaded",()=>{forceResize();status.textContent="Kamera siap. Arahkan ke gambar molekul.";});
document.querySelector("a-scene").addEventListener("arReady",()=>{forceResize();status.textContent="AR siap. Arahkan kamera ke gambar molekul.";});
document.querySelector("a-scene").addEventListener("targetFound",e=>{const i=e.target.getAttribute("mindar-image-target").targetIndex;status.textContent="Target terdeteksi.";mol.textContent=names[i]||"";});
document.querySelector("a-scene").addEventListener("targetLost",()=>{status.textContent="Arahkan kamera ke gambar molekul.";mol.textContent="";});
setTimeout(forceResize,1000);setTimeout(forceResize,2500);
</script>
</body>
</html>
