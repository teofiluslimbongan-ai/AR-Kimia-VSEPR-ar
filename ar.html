<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>AR Kimia — 6 Molekul</title>
<script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:Arial,sans-serif}
#info{position:fixed;z-index:30;top:12px;left:12px;right:12px;padding:12px 14px;border-radius:12px;background:rgba(255,255,255,.94);box-shadow:0 2px 12px rgba(0,0,0,.18);font-size:14px}
#name{font-weight:700;margin-top:4px}
</style>
</head>
<body>
<div id="info">
  <b>AR Kimia — Scan Once</b>
  <div>Arahkan kamera ke salah satu gambar molekul pada LKPD.</div>
  <div id="name">Belum ada target terdeteksi.</div>
</div>

<a-scene
  mindar-image="imageTargetSrc: ./targets.mind; maxTrack: 1;"
  color-space="sRGB"
  renderer="colorManagement: true, physicallyCorrectLights"
  vr-mode-ui="enabled: false"
  device-orientation-permission-ui="enabled: false">

  <a-assets>
    <a-asset-item id="h2o" src="./air-h2o.glb"></a-asset-item>
    <a-asset-item id="nh3" src="./amonia-nh3.glb"></a-asset-item>
    <a-asset-item id="co2" src="./co2.glb"></a-asset-item>
    <a-asset-item id="ch4" src="./metana-ch4.glb"></a-asset-item>
    <a-asset-item id="pcl5" src="./pcl5.glb"></a-asset-item>
    <a-asset-item id="sf6" src="./sf6.glb"></a-asset-item>
  </a-assets>

  <a-camera position="0 0 0" look-controls="enabled:false"></a-camera>

  <a-entity mindar-image-target="targetIndex: 0">
    <a-gltf-model src="#h2o" position="0 0 0.12" scale="0.35 0.35 0.35"
      animation="property:rotation;to:0 360 0;dur:8000;loop:true;easing:linear"></a-gltf-model>
  </a-entity>

  <a-entity mindar-image-target="targetIndex: 1">
    <a-gltf-model src="#nh3" position="0 0 0.12" scale="0.35 0.35 0.35"
      animation="property:rotation;to:0 360 0;dur:8000;loop:true;easing:linear"></a-gltf-model>
  </a-entity>

  <a-entity mindar-image-target="targetIndex: 2">
    <a-gltf-model src="#co2" position="0 0 0.12" scale="0.35 0.35 0.35"
      animation="property:rotation;to:0 360 0;dur:8000;loop:true;easing:linear"></a-gltf-model>
  </a-entity>

  <a-entity mindar-image-target="targetIndex: 3">
    <a-gltf-model src="#ch4" position="0 0 0.12" scale="0.35 0.35 0.35"
      animation="property:rotation;to:0 360 0;dur:8000;loop:true;easing:linear"></a-gltf-model>
  </a-entity>

  <a-entity mindar-image-target="targetIndex: 4">
    <a-gltf-model src="#pcl5" position="0 0 0.12" scale="0.35 0.35 0.35"
      animation="property:rotation;to:0 360 0;dur:8000;loop:true;easing:linear"></a-gltf-model>
  </a-entity>

  <a-entity mindar-image-target="targetIndex: 5">
    <a-gltf-model src="#sf6" position="0 0 0.12" scale="0.35 0.35 0.35"
      animation="property:rotation;to:0 360 0;dur:8000;loop:true;easing:linear"></a-gltf-model>
  </a-entity>
</a-scene>

<script>
const names = [
  "H₂O — Air",
  "NH₃ — Amonia",
  "CO₂ — Karbon dioksida",
  "CH₄ — Metana",
  "PCl₅ — Fosfor pentaklorida",
  "SF₆ — Sulfur heksafluorida"
];
const scene = document.querySelector("a-scene");
scene.addEventListener("targetFound", e => {
  const i = e.target.getAttribute("mindar-image-target").targetIndex;
  document.getElementById("name").textContent = "Terdeteksi: " + names[i];
});
scene.addEventListener("targetLost", () => {
  document.getElementById("name").textContent = "Arahkan kamera ke gambar molekul.";
});
</script>
</body>
</html>
